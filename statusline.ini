# =============================================================================
# Claude Code Status Line — Pricing Configuration
# =============================================================================
# 价格单位：每百万 token (per 1M tokens)
# 支持货币：CNY (人民币 ¥) 或 USD (美元 $)
# 修改后保存文件，下次触发 status line 时自动生效
# =============================================================================


[default]
# --- 默认定价（未匹配到具体模型时使用）---
input_price=3.00
output_price=6.00
cache_write_price=3.00
cache_read_price=0.025
currency=CNY

[Qwen3.6]
input_price=0
output_price=0
cache_write_price=0
cache_read_price=0
currency=CNY

[deepseek-v4-pro]
input_price=3.00
output_price=6.00
cache_write_price=3.00
cache_read_price=0.025
currency=CNY

[deepseek-v4-flash]
input_price=1.00
output_price=2.00
cache_write_price=1.00
cache_read_price=0.02
currency=CNY

[display]
# 状态行显示字段及顺序（逗号分隔）
# 可选字段: project, model, thinking, effort, bar, ctx, call, git, time, cost
order = project, model, bar, ctx, time, cost

[jsonl]
# JSONL 扫描周期（每 N 次 statusline 触发扫描一次 subagent token 用量）
# 增大值可减少 I/O 开销，减小值可更快反映 subagent 消耗
# 设为 0 可禁用 subagent 统计
sync_interval = 1
