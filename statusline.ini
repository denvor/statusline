# =============================================================================
# Claude Code Status Line — Pricing Configuration
# =============================================================================
# 价格单位：每百万 token (per 1M tokens)
# 支持货币：CNY (人民币 ¥) 或 USD (美元 $)
# 修改后保存文件，下次触发 status line 时自动生效
# =============================================================================


[default]
# --- 默认定价（未匹配到具体模型时使用）---
input_price=3.00
output_price=6.00
cache_write_price=3.00
cache_read_price=0.025
currency=CNY

[deepseek-v4-pro]
# --- DeepSeek V4 系列定价 ---
# 输入 token 价格（prompt / 提示词）
input_price=3.00

# 输出 token 价格（completion / 生成内容）
output_price=6.00

# 缓存写入 token 价格（写入 prompt cache）
cache_write_price=3.00

# 缓存读取 token 价格（命中 prompt cache）
cache_read_price=0.025

# --- 货币设置 ---
# CNY = 人民币 ¥  |  USD = 美元 $
currency=CNY

[deepseek-v4-flash]
# --- DeepSeek V4 系列定价 ---
# 输入 token 价格（prompt / 提示词）
input_price=1.00

# 输出 token 价格（completion / 生成内容）
output_price=2.00

# 缓存写入 token 价格（写入 prompt cache）
cache_write_price=1.00

# 缓存读取 token 价格（命中 prompt cache）
cache_read_price=0.02

# --- 货币设置 ---
# CNY = 人民币 ¥  |  USD = 美元 $
currency=CNY
